name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Show coverage summary
        run: go tool cover -func=coverage.out

      - name: Run go vet
        run: go vet ./...

      - name: Build server
        run: go build -o /tmp/calculator-server ./cmd/server

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: error

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build containers
        run: docker compose build

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 60

      - name: Smoke test full stack
        run: |
          set -euo pipefail

          curl --fail --silent --show-error http://localhost:8080/health \
            | grep -q '"status":"ok"'

          curl --fail --silent --show-error \
            -X POST http://localhost:8080/api/v1/calculate \
            -H 'Content-Type: application/json' \
            -d '{"operation":"multiply","a":6,"b":7}' \
            | grep -q '"result":42'

          curl --fail --silent --show-error http://localhost:3000/ \
            > /dev/null

          curl --fail --silent --show-error \
            -X POST http://localhost:3000/api/v1/calculate \
            -H 'Content-Type: application/json' \
            -d '{"operation":"add","a":10,"b":5}' \
            | grep -q '"result":15'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
